<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel de trabajo</title>
<style>
:root{--bg:#f6f5f2;--panel:#fff;--sunk:#efede8;--ink:#1d1d1b;--muted:#77756f;--line:#e2e0da;--acc:#c2410c;--ok:#059669;--warn:#b45309;--bad:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--panel:#1d1d1b;--sunk:#181817;--ink:#eceae4;--muted:#9a978f;--line:#2f2e2a;--acc:#fb923c;--ok:#34d399;--warn:#fbbf24;--bad:#f87171}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
button,select,input,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 9px}
button{cursor:pointer}button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0}
.kpi{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:13px}.kpi b{color:var(--ink);font-variant-numeric:tabular-nums}
.kpi .alert b{color:var(--acc)}
.sp{flex:1}
#upd{font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
#runner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin:12px 16px 0;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
#runner .state{display:flex;align-items:center;gap:8px;font-weight:600}
#runner .pulse{width:10px;height:10px;border-radius:50%;background:var(--muted)}
#runner.working .pulse{background:var(--ok);animation:p 1.4s infinite}
#runner.paused .pulse{background:var(--warn)}#runner.stale .pulse,#runner.stopped .pulse{background:var(--bad)}
@keyframes p{50%{opacity:.35}}
#runner .info{color:var(--muted);font-size:13px}#runner .info b{color:var(--ink)}
#agents{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;padding:12px 16px}
.agent{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;border-top:3px solid var(--c);min-width:0}
.agent.sel{outline:2px solid var(--c)}
.agent .top{display:flex;align-items:center;gap:6px}
.agent .name{font-weight:600}
.badge{margin-left:auto;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.badge.working{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.agent .role{font-size:12px;color:var(--muted);margin:2px 0 6px}
.agent .now,.agent .next{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agent .next,.agent .load{color:var(--muted);font-size:12px}.agent .load{margin-top:4px}
#board{flex:1;display:grid;grid-template-columns:repeat(7,minmax(190px,1fr));gap:10px;padding:4px 16px 16px;overflow-x:auto;align-items:start}
.col{background:var(--sunk);border:1px solid var(--line);border-radius:10px;min-height:140px;display:flex;flex-direction:column}
.col.human{border-color:color-mix(in srgb,var(--acc) 55%,var(--line))}
.col.over{outline:2px dashed var(--acc)}
.col h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0;padding:10px 10px 6px;display:flex;gap:6px}
.col.human h2{color:var(--acc)}
.col h2 span:last-child{margin-left:auto;font-variant-numeric:tabular-nums;text-transform:none}
.cards{display:flex;flex-direction:column;gap:6px;padding:0 8px 8px;flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:8px;padding:8px 9px;cursor:grab}
.card.live{box-shadow:0 0 0 2px color-mix(in srgb,var(--ok) 45%,transparent)}
.card .meta{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--muted);flex-wrap:wrap}
.card .t{margin:4px 0 6px;font-weight:500}
.card .manual{font-size:12px;background:color-mix(in srgb,var(--acc) 10%,transparent);color:var(--ink);border-radius:6px;padding:5px 7px;margin:4px 0 6px}
.prio{font-size:10px;text-transform:uppercase;letter-spacing:.04em;padding:0 5px;border-radius:4px;border:1px solid currentColor}
.prio.alta{color:var(--bad)}.prio.media{color:var(--warn)}.prio.baja{color:var(--muted)}
.tm{margin-left:auto;font-variant-numeric:tabular-nums}.tm .over{color:var(--bad)}.tm .under{color:var(--ok)}
.bar{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--c)}.bar.over i{background:var(--bad)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);width:min(580px,94vw);padding:0}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
dialog label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
dialog .full{grid-column:1/-1}
dialog textarea{min-height:64px;resize:vertical}
dialog h3{margin:0;grid-column:1/-1;font-size:15px}
.facts{grid-column:1/-1;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}.facts b{color:var(--ink)}
.log{grid-column:1/-1;max-height:170px;overflow:auto;font-size:12px;border-top:1px solid var(--line);padding-top:8px}
.log div{padding:2px 0;color:var(--muted)}.log b{color:var(--ink);font-weight:500}
.actions{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}
@media (max-width:700px){#board{grid-template-columns:repeat(7,82vw)}}
</style>
</head>
<body>
<header>
  <h1 id="title">Panel de trabajo</h1>
  <div class="kpi">
    <span>Cola automática <b id="kQueue">–</b></span>
    <span class="alert">Te necesitan <b id="kHuman">–</b></span>
    <span>Hecho <b id="kDone">–</b></span>
    <span title="Media de tiempo real / estimado en tareas terminadas con estimación">Precisión estimaciones <b id="kFactor">–</b></span>
  </div>
  <span class="sp"></span>
  <span id="upd"></span>
  <a href="/" style="color:var(--muted)">← App</a>
  <button class="primary" id="new">Nueva tarea</button>
</header>
<section id="runner"><span class="state"><span class="pulse"></span><span id="rState">–</span></span>
  <span class="info" id="rInfo"></span><span class="sp"></span><button id="rToggle">Pausar</button></section>
<section id="agents"></section>
<main id="board"></main>

<dialog id="dlg">
  <form method="dialog" id="f">
    <h3 id="fId"></h3>
    <label class="full">Título <input name="title" required></label>
    <label>Responsable <select name="owner"></select></label>
    <label>Estado <select name="status"></select></label>
    <label>Prioridad <select name="priority"><option>alta</option><option>media</option><option>baja</option></select></label>
    <label>Estimación (min de agente) <input name="estimate_min" type="number" step="1" min="1"></label>
    <label class="full">Depende de <input name="deps" placeholder="T-003, T-007"></label>
    <label class="full">Descripción <textarea name="desc"></textarea></label>
    <label class="full">Lo que tienes que hacer tú (vacío = la hacen los agentes solos) <input name="manual"></label>
    <label class="full">Añadir nota <input name="note" placeholder="Opcional: queda en el historial"></label>
    <div class="facts" id="fFacts"></div>
    <div class="log" id="fLog"></div>
    <div class="actions"><button value="cancel" formnovalidate>Cancelar</button><button class="primary" value="ok">Guardar</button></div>
  </form>
</dialog>

<script>
const $ = (s) => document.querySelector(s);
let B = null, filter = null, editing = false, dragId = null;
const PR = { alta: 0, media: 1, baja: 2 };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtMin = (m) => m == null ? "–" : m < 1 ? "<1 min" : m < 60 ? Math.round(m) + " min" : (m / 60).toFixed(1).replace(".", ",") + " h";
const minsSince = (t) => t ? (Date.now() - new Date(t)) / 60000 : 0;
const agentOf = (id) => B.agents.find((a) => a.id === id) || { name: id, color: "#888" };
const isAuto = (t) => t.owner !== "consultor" && t.status !== "human";
const verifyMin = (t) => (t.runs || []).filter((r) => r.mode === "verify").reduce((s, r) => s + (r.min || 0), 0);
function realMin(t) {  // tiempo real medido: trabajo (doing) + verificación; en curso cuenta en vivo
  let m = (t.actual_min || 0) + verifyMin(t);
  if (t.status === "doing" && t.started_at) m += minsSince(t.started_at);
  return t.actual_min == null && t.status !== "doing" && !verifyMin(t) ? null : m;
}
function factor() {
  const s = B.tasks.filter((t) => t.status === "done" && t.estimate_min && t.actual_min != null);
  if (s.length < 3) return { f: 1, n: s.length };
  return { f: s.reduce((a, t) => a + realMin(t), 0) / s.reduce((a, t) => a + t.estimate_min, 0), n: s.length };
}

async function api(method, url, body) {
  const r = await fetch(url, { method, headers: { "Content-Type": "application/json" }, body: body && JSON.stringify(body) });
  if (!r.ok) alert("No se pudo guardar: " + (await r.text()));
  return load(true);
}
async function load(force) {
  if (!force && (editing || dragId)) return;
  try {
    const nb = await (await fetch("/api/board", { cache: "no-store" })).json();
    if (force || !B || nb.updated !== B.updated) { B = nb; render(); } else { B.runner = nb.runner; renderRunner(); }
    $("#upd").textContent = "Actualizado " + new Date(B.updated).toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  } catch (e) { $("#upd").textContent = "Sin conexión con el servidor"; }
}

function renderRunner() {
  const r = B.runner || {}, el = $("#runner");
  const stale = r.state === "working" && minsSince(r.heartbeat) > 70;  // más allá del timeout máximo por tarea
  const st = stale ? "stale" : r.state || "stopped";
  el.className = st;
  $("#rState").textContent = { working: "Agentes trabajando", idle: "En espera", paused: "En pausa", stopped: "Runner parado", stale: "Sin señal del runner" }[st];
  let info = "";
  if (st === "working" && r.current) {
    const t = B.tasks.find((x) => x.id === r.current);
    info = `<b>${esc(agentOf(r.agent).name)}</b> con ${r.current}${t ? " · " + esc(t.title) : ""} · lleva <b>${fmtMin(minsSince(r.started))}</b>${t?.estimate_min ? " de " + fmtMin(t.estimate_min) + " estimados" : ""}`;
  } else if (st === "stopped") info = "Ejecuta <b>run-agents.bat</b> para que trabajen solos";
  else info = esc(r.message || "");
  $("#rInfo").innerHTML = info;
  $("#rToggle").textContent = r.enabled === false ? "Reanudar" : "Pausar";
  $("#rToggle").onclick = () => api("POST", "/api/board/runner", { enabled: r.enabled === false });
}

function render() {
  $("#title").textContent = "Panel de trabajo · " + (B.project || "");
  const { f, n } = factor();
  const queue = B.tasks.filter((t) => ["review", "next", "backlog", "doing"].includes(t.status) && isAuto(t));
  const qMin = queue.reduce((s, t) => s + Math.max(0, (t.estimate_min || 10) - (t.status === "doing" ? minsSince(t.started_at) : 0)), 0) * f;
  const eta = new Date(Date.now() + qMin * 60000).toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
  $("#kQueue").textContent = `${queue.length} tareas · ~${fmtMin(qMin)} (≈ ${eta})`;
  $("#kHuman").textContent = B.tasks.filter((t) => t.status === "human" || (t.owner === "consultor" && t.status !== "done")).length;
  $("#kDone").textContent = B.tasks.filter((t) => t.status === "done").length + " / " + B.tasks.length;
  $("#kFactor").textContent = n < 3 ? `sin datos (${n}/3 tareas medidas)` : `real = ${f.toFixed(2).replace(".", ",")} × estimado (${n})`;
  renderRunner();

  const ORD = ["doing", "review", "next", "backlog", "human"];
  $("#agents").innerHTML = B.agents.map((a) => {
    const mine = B.tasks.filter((t) => t.owner === a.id);
    const cur = B.tasks.find((t) => t.id === a.current);
    const nxt = mine.filter((t) => ORD.includes(t.status) && t.id !== a.current)
      .sort((x, y) => ORD.indexOf(x.status) - ORD.indexOf(y.status) || PR[x.priority] - PR[y.priority])[0];
    const load = mine.filter((t) => t.status !== "done").reduce((s, t) => s + (t.estimate_min || 10), 0) * f;
    return `<div class="agent ${filter === a.id ? "sel" : ""}" style="--c:${a.color}" data-a="${a.id}">
      <div class="top"><span class="dot" style="background:${a.color}"></span><span class="name">${esc(a.name)}</span><span class="badge ${a.status}">${a.status === "working" ? "Trabajando" : "Libre"}</span></div>
      <div class="role">${esc(a.role)}</div>
      <div class="now">${cur ? `▶ ${cur.id} · ${esc(cur.title)}` : "<span style='color:var(--muted)'>Sin tarea en curso</span>"}</div>
      <div class="next">${nxt ? `Siguiente: ${nxt.id} · ${esc(nxt.title)}` : "Sin próximas tareas"}</div>
      <div class="load">${mine.filter((t) => t.status !== "done").length} tareas · ~${fmtMin(load)}</div>
    </div>`;
  }).join("");
  document.querySelectorAll(".agent").forEach((el) => el.onclick = () => { filter = filter === el.dataset.a ? null : el.dataset.a; render(); });

  $("#board").innerHTML = B.columns.map((c) => {
    const ts = B.tasks.filter((t) => t.status === c.id && (!filter || t.owner === filter))
      .sort((x, y) => c.id === "done" ? (y.finished_at || "").localeCompare(x.finished_at || "") : PR[x.priority] - PR[y.priority] || x.id.localeCompare(y.id));
    const m = c.id === "done" ? ts.reduce((s, t) => s + (realMin(t) || 0), 0) : ts.reduce((s, t) => s + (t.estimate_min || 0), 0);
    return `<section class="col ${c.id}" data-s="${c.id}"><h2><span>${c.name}</span><span>${ts.length}${m ? " · " + fmtMin(m) : ""}</span></h2>
      <div class="cards">${ts.map(card).join("")}</div></section>`;
  }).join("");
  document.querySelectorAll(".card").forEach((el) => {
    el.ondragstart = (e) => { dragId = el.dataset.id; e.dataTransfer.effectAllowed = "move"; };
    el.ondragend = () => setTimeout(() => (dragId = null), 50);
    el.onclick = () => openTask(el.dataset.id);
  });
  document.querySelectorAll(".col").forEach((col) => {
    col.ondragover = (e) => { e.preventDefault(); col.classList.add("over"); };
    col.ondragleave = () => col.classList.remove("over");
    col.ondrop = (e) => {
      e.preventDefault(); col.classList.remove("over");
      const id = dragId; dragId = null;
      const t = B.tasks.find((x) => x.id === id);
      if (t && t.status !== col.dataset.s) api("PATCH", "/api/board/task/" + id, { status: col.dataset.s });
    };
  });
}
function card(t) {
  const a = agentOf(t.owner), real = realMin(t), est = t.estimate_min;
  const live = B.runner?.current === t.id && B.runner?.state === "working";
  let tm = "";
  if (real == null) tm = est ? `est ${fmtMin(est)}` : "";
  else if (!est) tm = `real ${fmtMin(real)}`;
  else tm = `${fmtMin(real)} <span class="${real > est * 1.2 ? "over" : real < est * 0.8 ? "under" : ""}">/ ${fmtMin(est)}</span>`;
  const pct = est && real != null ? Math.min(100, real / est * 100) : 0;
  const manual = (t.status === "human" || t.owner === "consultor") && t.status !== "done" && t.manual;
  return `<article class="card ${live ? "live" : ""}" draggable="true" data-id="${t.id}" style="--c:${a.color}">
    <div class="meta"><span>${t.id}</span><span class="prio ${t.priority}">${t.priority}</span><span class="tm">${tm}</span></div>
    <div class="t">${esc(t.title)}</div>
    ${manual ? `<div class="manual"><b>Tú:</b> ${esc(t.manual)}</div>` : ""}
    <div class="meta"><span class="dot" style="background:${a.color}"></span>${esc(a.name)}${t.deps?.length ? ` · depende de ${t.deps.join(", ")}` : ""}${t.runs?.length ? ` · ${t.runs.length} ejecuc.` : ""}</div>
    ${t.status === "doing" && est ? `<div class="bar ${real > est ? "over" : ""}"><i style="width:${pct}%"></i></div>` : ""}
  </article>`;
}

const f = $("#f");
function openTask(id) {
  editing = true;
  const isNew = !id;
  const t = isNew ? { title: "", owner: filter && filter !== "consultor" ? filter : "desarrollador", status: "backlog", priority: "media", estimate_min: 10, desc: "", deps: [], manual: "", log: [] }
    : B.tasks.find((x) => x.id === id);
  f.owner.innerHTML = B.agents.map((a) => `<option value="${a.id}">${esc(a.name)}</option>`).join("");
  f.status.innerHTML = B.columns.map((c) => `<option value="${c.id}">${c.name}</option>`).join("");
  $("#fId").textContent = isNew ? "Nueva tarea" : t.id;
  for (const k of ["title", "owner", "status", "priority", "estimate_min", "desc", "manual"]) f[k].value = t[k] ?? "";
  f.deps.value = (t.deps || []).join(", "); f.note.value = "";
  const runs = t.runs || [];
  $("#fFacts").innerHTML = isNew ? "" : [
    `Estimado <b>${fmtMin(t.estimate_min)}</b>`, `Real <b>${fmtMin(realMin(t))}</b>`,
    t.started_at ? `Inicio <b>${new Date(t.started_at).toLocaleString("es-ES", { dateStyle: "short", timeStyle: "short" })}</b>` : "",
    runs.length ? `Ejecuciones <b>${runs.length}</b>` : "",
    runs.some((r) => r.turns) ? `Turnos <b>${runs.reduce((s, r) => s + (r.turns || 0), 0)}</b>` : "",
    runs.some((r) => r.tokens) ? `Tokens <b>${runs.reduce((s, r) => s + (r.tokens || 0), 0).toLocaleString("es-ES")}</b>` : "",
  ].filter(Boolean).join("");
  $("#fLog").innerHTML = [...(t.log || [])].reverse().map((l) =>
    `<div>${new Date(l.t).toLocaleString("es-ES", { dateStyle: "short", timeStyle: "short" })} · <b>${esc(l.by)}</b> · ${esc(l.msg)}</div>`).join("");
  $("#dlg").onclose = () => {
    editing = false;
    if ($("#dlg").returnValue !== "ok") return;
    const body = { title: f.title.value.trim(), owner: f.owner.value, priority: f.priority.value, status: f.status.value,
      estimate_min: +f.estimate_min.value || null, desc: f.desc.value, manual: f.manual.value.trim() || null,
      deps: f.deps.value.split(",").map((s) => s.trim()).filter(Boolean), note: f.note.value.trim() || undefined };
    isNew ? api("POST", "/api/board/task", body) : api("PATCH", "/api/board/task/" + t.id, body);
  };
  $("#dlg").returnValue = ""; $("#dlg").showModal();
}
$("#new").onclick = () => openTask(null);
load(); setInterval(load, 4000); setInterval(() => B && !editing && !dragId && render(), 30000);
</script>
</body>
</html>
